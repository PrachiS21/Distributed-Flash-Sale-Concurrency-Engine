spring.datasource.url=jdbc:postgresql://localhost:5432/bigB_days
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:postgres}

# Hibernate settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Tomcat / pool limits (so we can watch the server choke under load)
server.tomcat.threads.max=200
spring.datasource.hikari.maximum-pool-size=10

# Redis Connection Settings
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=2000ms

# Optional: Add credentials if your Redis instance requires authentication
# spring.data.redis.password=your_secure_password

# Specify Redis as the cache provider
spring.cache.type=redis
